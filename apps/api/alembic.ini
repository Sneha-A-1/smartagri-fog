# Alembic CLI configuration (the API also runs migrations automatically at start-up).
# Create a new migration after changing models.py:
#   cd apps/api
#   uv run alembic revision --autogenerate -m "describe the change"
[alembic]
script_location = src/smartagri_api/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

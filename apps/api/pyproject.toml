[project]
name = "smartagri-api"
version = "0.1.0"
description = "SmartAgri-Fog web API (FastAPI): a thin layer over smartagri-core"
requires-python = ">=3.12"
dependencies = [
    "smartagri-core",
    "smartagri-proposed",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[project.scripts]
smartagri-api = "smartagri_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartagri_api"]

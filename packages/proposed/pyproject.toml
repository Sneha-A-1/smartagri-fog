[project]
name = "smartagri-proposed"
version = "0.1.0"
description = "Proposed research algorithms for SmartAgri-Fog (AURA). Versioned separately from the core."
requires-python = ">=3.12"
dependencies = ["smartagri-core"]

[project.entry-points."smartagri.plugins"]
proposed = "smartagri_proposed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartagri_proposed"]

[project]
name = "smartagri-fog"
version = "0.1.0"
description = "SmartAgri-Fog research platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "smartagri-core",
    "smartagri-proposed",
    "smartagri-api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/proposed", "apps/api"]

[tool.uv.sources]
smartagri-core = { workspace = true }
smartagri-proposed = { workspace = true }
smartagri-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/proposed/tests", "apps/api/tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
